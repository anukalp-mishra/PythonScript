name: Python Automation

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes

jobs:
  automate-naukri-task:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies in naukri_env
      run: |
        python -m venv naukri_env
        source naukri_env/bin/activate
        python -m pip install --upgrade pip
        pip install selenium

    - name: Install Specific Google Chrome Version
      run: |
        sudo apt-get install -y software-properties-common
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable=134.0.6998.166-1

    - name: Download Specific ChromeDriver Version
      run: |
        wget "https://chromedriver.storage.googleapis.com/134.0.6998.165/chromedriver_linux64.zip"
        unzip chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver

    - name: Verify Chrome and ChromeDriver Versions
      run: |
        echo "Verifying installed versions..."
        if ! command -v google-chrome &> /dev/null
        then
            echo "Google Chrome is not installed or not in PATH"
            exit 1
        fi
        echo "Google Chrome version:"
        google-chrome --version

        if ! command -v chromedriver &> /dev/null
        then
            echo "ChromeDriver is not installed or not in PATH"
            exit 1
        fi
        echo "ChromeDriver version:"
        chromedriver --version

    - name: Run Python Script
      run: |
        source naukri_env/bin/activate
        python your_script.py